[project]
name = "itime-server"
version = "0.1.0"
description = "iTime 服务端"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosmtplib>=5,<6",
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "cryptography>=46,<48",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pyotp>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
    "openpyxl>=3.1,<4",
    "icalendar>=6,<7",
    "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: 需要隔离的真实 PostgreSQL"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
