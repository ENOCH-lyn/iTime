name: itime

x-worker: &worker
  image: itime-api
  env_file:
    - .env.prod
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    disable: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: itime
      POSTGRES_USER: itime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - itime_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itime -d itime"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 唯一公网入口：Cloudflare Tunnel 指向本机 18000。
      - "127.0.0.1:18000:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  ai-worker:
    <<: *worker
    command: ["python", "-m", "itime.ai.worker"]

  subscription-worker:
    <<: *worker
    command: ["python", "-m", "itime.calendar.subscription_worker"]

  public-links-worker:
    <<: *worker
    command: ["python", "-m", "itime.public_links.worker"]

  data-export-worker:
    <<: *worker
    command: ["python", "-m", "itime.data_export.worker"]

  account-deletion-worker:
    <<: *worker
    command: ["python", "-m", "itime.account_deletion.worker"]

  tasks-cleanup-worker:
    <<: *worker
    command: ["python", "-m", "itime.tasks.cleanup_worker"]

  calendar-cleanup-worker:
    <<: *worker
    command: ["python", "-m", "itime.calendar.cleanup_worker"]

  execution-cleanup-worker:
    <<: *worker
    command: ["python", "-m", "itime.execution.cleanup_worker"]

  review-cleanup-worker:
    <<: *worker
    command: ["python", "-m", "itime.review.cleanup_worker"]

  ai-retention-worker:
    <<: *worker
    command: ["python", "-m", "itime.ai.retention_worker"]

  sync-cleanup-worker:
    <<: *worker
    command: ["python", "-m", "itime.sync.cleanup_worker"]

volumes:
  itime_db:
